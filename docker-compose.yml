services:
  web:
    image: "${ECR_IMAGE_URI:?ECR_IMAGE_URI is required}"
    container_name: customer-web
    init: true
    env_file:
      - ./.env
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const r=http.get({host:'127.0.0.1',port:3000,path:'/',timeout:3000},res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1);});"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
