services:
  web:
    image: "${ECR_IMAGE_URI:?ECR_IMAGE_URI is required}"
    container_name: customer-web
    init: true
    env_file:
      - ./.env
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      # Match ALB target-group path: /api/health only (liveness).
      # Do not gate on /api/warm — warm needs STOREFRONT_WARM_SHOP_ID(S) and
      # returns 503 without them, which would mark a healthy app unhealthy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
