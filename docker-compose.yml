services:
  web:
    image: "${ECR_IMAGE_URI:?ECR_IMAGE_URI is required}"
    container_name: customer-web
    init: true
    env_file:
      - ./.env
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      # /api/health = liveness; /api/warm keeps catalog cache hot between shoppers.
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/api/health'),fetch('http://127.0.0.1:3000/api/warm')]).then(async([h,w])=>{process.exit(h.ok&&w.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 45s
