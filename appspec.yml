version: 0.0
os: linux

files:
  - source: /
    destination: /home/deploy/yaadro/customer-web
    overwrite: true

permissions:
  - object: /home/deploy/yaadro/customer-web
    pattern: "**"
    owner: deploy
    group: deploy

hooks:
  # Runs from the *last successful* revision on the next deploy.
  # Script must stay bounded (timeouts inside) and always exit 0 — see application_stop.sh.
  ApplicationStop:
    - location: scripts/cicd/application_stop.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/cicd/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/cicd/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/cicd/application_start.sh
      # t4g.micro image extract can exceed 15m; prune + pull needs headroom.
      timeout: 2700
      runas: root
  ValidateService:
    - location: scripts/cicd/validate_service.sh
      timeout: 180
      runas: root

