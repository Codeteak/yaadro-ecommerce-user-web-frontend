name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Override via repository variable CLOUDFLARE_PAGES_PROJECT_NAME if needed
      CLOUDFLARE_PAGES_PROJECT_NAME: yaadro-ecommerce-user-web-frontend
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SHOP_ID: ${{ vars.NEXT_PUBLIC_SHOP_ID }}
      NEXT_PUBLIC_TENANT_RESOLVER_URL: ${{ vars.NEXT_PUBLIC_TENANT_RESOLVER_URL }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
      NEXT_PUBLIC_AUTH_SESSION_DAYS: ${{ vars.NEXT_PUBLIC_AUTH_SESSION_DAYS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -f out/index.html
          test -f out/_redirects
          echo "Build output OK ($(find out -type f | wc -l) files)"

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it to the production environment secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add it to the production environment secrets."
            exit 1
          fi
          ACCOUNT_ID="$(echo -n "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '[:space:]')"
          if ! echo "${ACCOUNT_ID}" | grep -qE '^[a-f0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 lowercase hex characters (Account ID from Workers & Pages sidebar). Check for spaces, quotes, or Zone ID mix-up."
            exit 1
          fi
          echo "Checking Cloudflare API access..."
          npx wrangler pages project list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create "${CLOUDFLARE_PAGES_PROJECT_NAME}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy out \
            --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
