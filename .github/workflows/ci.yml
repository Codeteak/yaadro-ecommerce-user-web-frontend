name: CI

on:
  push:
    branches:
      - fayad
      - main
  pull_request:
    branches:
      - fayad
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_BASE_URL || 'https://example.com' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://example.com/api' }}
      NEXT_PUBLIC_DEFAULT_SHOP_ID: ${{ vars.NEXT_PUBLIC_DEFAULT_SHOP_ID || vars.NEXT_PUBLIC_SHOP_ID || '00000000-0000-4000-8000-000000000001' }}
      NEXT_PUBLIC_SHOP_ID: ${{ vars.NEXT_PUBLIC_SHOP_ID || vars.NEXT_PUBLIC_DEFAULT_SHOP_ID || '00000000-0000-4000-8000-000000000001' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Production path matches Dockerfile / CodePipeline (`next start` / standalone).
      # Static Pages export is not part of the default check — use
      # `npm run build:static` / pages:deploy when needed (was a second full build).
      - name: Build Next.js server bundle
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_STATIC_EXPORT: "false"
